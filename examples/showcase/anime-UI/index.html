<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Dancing Flower</title>
    <meta name="description" content="Dancing Flower — A-Frame">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        font-family: Arial, sans-serif;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        max-width: 280px;
        z-index: 1000;
      }
      #info h1 {
        margin: 0 0 10px 0;
        font-size: 24px;
        color: #ff6b9d;
      }
      #info p {
        margin: 5px 0;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>🌸 Dancing Flower</h1>
      <p>A mesmerizing blooming flower animation.</p>
      <p>Watch as petals unfurl and dance!</p>
    </div>

    <a-scene background="color: #0a0520">
      
      <!-- Camera -->
      <a-entity position="0 1.6 3.5">
        <a-camera></a-camera>
      </a-entity>

      <!-- Flower Stem -->
      <a-box position="0 -0.5 -3" width="0.1" height="2" depth="0.1" color="#4caf50"
             animation="property: scale; from: 1 0 1; to: 1 1 1; dur: 800; easing: easeOutCubic"></a-box>

      <!-- Flower Center - Yellow Glow -->
      <a-sphere position="0 0.5 -3" radius="0.3" color="#ffeb3b" opacity="0.9"
                animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; delay: 600; easing: easeOutElastic"
                animation__glow="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 2000; delay: 1100; easing: easeInOutSine">
        <a-sphere radius="0.5" color="#ffeb3b" opacity="0.3"
                  animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine"></a-sphere>
      </a-sphere>

      <!-- Petal Layer 1 - Inner petals (4 petals) -->
      <!-- Petal 1 - Top -->
      <a-plane position="0 1.2 -3" rotation="0 0 0" width="0.6" height="1.2" color="#ff6b9d" opacity="0.8"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 400; delay: 700; easing: easeOutBack"
               animation__sway="property: rotation; from: 0 0 0; to: 0 0 10; dir: alternate; loop: true; dur: 2000; delay: 1100; easing: easeInOutSine"></a-plane>

      <!-- Petal 2 - Right -->
      <a-plane position="0.85 0.5 -3" rotation="0 0 90" width="0.6" height="1.2" color="#ff6b9d" opacity="0.8"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 400; delay: 750; easing: easeOutBack"
               animation__sway="property: rotation; from: 0 0 90; to: 0 0 100; dir: alternate; loop: true; dur: 2200; delay: 1150; easing: easeInOutSine"></a-plane>

      <!-- Petal 3 - Bottom -->
      <a-plane position="0 -0.2 -3" rotation="0 0 180" width="0.6" height="1.2" color="#ff6b9d" opacity="0.8"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 400; delay: 800; easing: easeOutBack"
               animation__sway="property: rotation; from: 0 0 180; to: 0 0 190; dir: alternate; loop: true; dur: 1900; delay: 1200; easing: easeInOutSine"></a-plane>

      <!-- Petal 4 - Left -->
      <a-plane position="-0.85 0.5 -3" rotation="0 0 270" width="0.6" height="1.2" color="#ff6b9d" opacity="0.8"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 400; delay: 850; easing: easeOutBack"
               animation__sway="property: rotation; from: 0 0 270; to: 0 0 280; dir: alternate; loop: true; dur: 2100; delay: 1250; easing: easeInOutSine"></a-plane>

      <!-- Petal Layer 2 - Outer petals (4 petals, offset 45 degrees) -->
      <!-- Petal 5 - Top-Right -->
      <a-plane position="0.6 1 -3.1" rotation="0 0 45" width="0.7" height="1.4" color="#ba68c8" opacity="0.7"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 400; delay: 900; easing: easeOutBack"
               animation__sway="property: rotation; from: 0 0 45; to: 0 0 55; dir: alternate; loop: true; dur: 2300; delay: 1300; easing: easeInOutSine"></a-plane>

      <!-- Petal 6 - Bottom-Right -->
      <a-plane position="0.6 0 -3.1" rotation="0 0 135" width="0.7" height="1.4" color="#ba68c8" opacity="0.7"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 400; delay: 950; easing: easeOutBack"
               animation__sway="property: rotation; from: 0 0 135; to: 0 0 145; dir: alternate; loop: true; dur: 2400; delay: 1350; easing: easeInOutSine"></a-plane>

      <!-- Petal 7 - Bottom-Left -->
      <a-plane position="-0.6 0 -3.1" rotation="0 0 225" width="0.7" height="1.4" color="#ba68c8" opacity="0.7"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 400; delay: 1000; easing: easeOutBack"
               animation__sway="property: rotation; from: 0 0 225; to: 0 0 235; dir: alternate; loop: true; dur: 2200; delay: 1400; easing: easeInOutSine"></a-plane>

      <!-- Petal 8 - Top-Left -->
      <a-plane position="-0.6 1 -3.1" rotation="0 0 315" width="0.7" height="1.4" color="#ba68c8" opacity="0.7"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 400; delay: 1050; easing: easeOutBack"
               animation__sway="property: rotation; from: 0 0 315; to: 0 0 325; dir: alternate; loop: true; dur: 2500; delay: 1450; easing: easeInOutSine"></a-plane>

      <!-- Rotating Ring Effect around flower -->
      <a-torus position="0 0.5 -3" radius="1.2" radius-tubular="0.02" color="#9c27b0" opacity="0.6"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; delay: 1000; easing: easeOutBack"
               animation__rotate="property: rotation; from: 0 0 0; to: 0 0 360; loop: true; dur: 20000; delay: 1600; easing: linear"></a-torus>

      <a-torus position="0 0.5 -3" radius="1.5" radius-tubular="0.015" color="#ff6b9d" opacity="0.4"
               animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; delay: 1100; easing: easeOutBack"
               animation__rotate="property: rotation; from: 0 0 0; to: 0 0 -360; loop: true; dur: 30000; delay: 1700; easing: linear"></a-torus>

      <!-- Magical particles around the flower -->
      <a-sphere position="1 0.8 -2.5" radius="0.05" color="#ffeb3b" opacity="0.8"
                animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 300; delay: 1200; easing: easeOutBack"
                animation__float="property: position; from: 1 0.8 -2.5; to: 1.2 1.2 -2.5; dir: alternate; loop: true; dur: 3000; delay: 1500; easing: easeInOutSine"></a-sphere>

      <a-sphere position="-1 0.8 -2.5" radius="0.05" color="#ffeb3b" opacity="0.8"
                animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 300; delay: 1250; easing: easeOutBack"
                animation__float="property: position; from: -1 0.8 -2.5; to: -1.2 1.2 -2.5; dir: alternate; loop: true; dur: 2800; delay: 1550; easing: easeInOutSine"></a-sphere>

      <a-sphere position="0 1.5 -2.5" radius="0.05" color="#ff6b9d" opacity="0.8"
                animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 300; delay: 1300; easing: easeOutBack"
                animation__float="property: position; from: 0 1.5 -2.5; to: 0 1.8 -2.5; dir: alternate; loop: true; dur: 3200; delay: 1600; easing: easeInOutSine"></a-sphere>

      <a-sphere position="0.8 -0.2 -2.5" radius="0.05" color="#ba68c8" opacity="0.8"
                animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 300; delay: 1350; easing: easeOutBack"
                animation__float="property: position; from: 0.8 -0.2 -2.5; to: 1 -0.5 -2.5; dir: alternate; loop: true; dur: 2900; delay: 1650; easing: easeInOutSine"></a-sphere>

      <a-sphere position="-0.8 -0.2 -2.5" radius="0.05" color="#ba68c8" opacity="0.8"
                animation__appear="property: scale; from: 0 0 0; to: 1 1 1; dur: 300; delay: 1400; easing: easeOutBack"
                animation__float="property: position; from: -0.8 -0.2 -2.5; to: -1 -0.5 -2.5; dir: alternate; loop: true; dur: 3100; delay: 1700; easing: easeInOutSine"></a-sphere>

      <!-- Lights -->
      <a-light type="point" color="#ff6b9d" distance="10" position="0 0.5 -1" intensity="1.5"></a-light>
      <a-light type="point" color="#ffeb3b" distance="8" position="0 0.5 -5" intensity="1"></a-light>
      <a-light type="ambient" color="#2a1a3a" intensity="0.5"></a-light>

    </a-scene>
  </body>
</html>
