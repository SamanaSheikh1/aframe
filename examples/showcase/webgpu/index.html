<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dancing Flower • A-Frame WebGPU</title>
    <meta name="description" content="Dancing Flower with WebGPU and TSL • A-Frame" />
    <script type="importmap">
      {
        "imports": {
          "aframe": "../../../dist/aframe-master.module.min.js",
          "three": "https://cdn.jsdelivr.net/npm/super-three@0.173.5/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/super-three@0.173.5/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/super-three@0.173.5/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/super-three@0.173.5/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import AFRAME from 'aframe';
      import { color, cos, float, mix, range, sin, time, uniform, uv, vec3, vec4, PI2, smoothstep, pow } from 'three/tsl';
      import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
      
      AFRAME.registerComponent('dancing-flower', {
        init() {
          const material = new THREE.SpriteNodeMaterial({
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          });
          
          // Flower parameters
          const petalCount = 8;
          const danceSpeed = uniform(0.8);
          const swayAmount = uniform(0.3);
          const size = uniform(0.12);
          
          material.scaleNode = range(0, 1).mul(size);
          
          // Radial position (0 = center, 1 = outer edge)
          const radiusRatio = range(0, 1);
          
          // Create petal-like distribution
          const petalIndex = range(0, petalCount).floor();
          const petalAngle = petalIndex.mul(PI2.div(petalCount));
          
          // Petal shape - wider at middle, narrower at base and tip
          const petalShape = sin(radiusRatio.mul(Math.PI)).mul(1.2);
          const radius = radiusRatio.mul(radiusRatio).mul(2.5).mul(petalShape);
          
          // Dancing motion - each petal sways independently
          const danceTime = time.mul(danceSpeed);
          const petalSway = sin(danceTime.add(petalIndex.mul(0.5))).mul(swayAmount).mul(radiusRatio);
          const verticalDance = cos(danceTime.mul(0.7).add(petalIndex.mul(0.3))).mul(0.2).mul(radiusRatio);
          
          // Spiral twist as flower dances
          const spiralTwist = sin(danceTime.mul(0.5)).mul(radiusRatio).mul(0.4);
          const angle = petalAngle.add(petalSway).add(spiralTwist);
          
          // Position with vertical wave
          const position = vec3(
            cos(angle).mul(radius),
            radiusRatio.mul(0.5).add(verticalDance),
            sin(angle).mul(radius)
          );
          
          // Add organic randomness to petals
          const randomOffset = range(vec3(-1), vec3(1))
            .mul(0.15)
            .mul(radiusRatio.pow(2))
            .mul(petalShape);
          
          material.positionNode = position.add(randomOffset);
          
          // Vibrant flower colors - gradient from center to petals
          const centerColor = uniform(color('#ffeb3b'));  // Bright yellow center
          const midColor = uniform(color('#ff6b9d'));     // Pink-magenta
          const tipColor = uniform(color('#9c27b0'));     // Purple tips
          
          // Multi-color gradient
          const innerGradient = mix(centerColor, midColor, smoothstep(0, 0.5, radiusRatio));
          const colorFinal = mix(innerGradient, tipColor, smoothstep(0.5, 1, radiusRatio));
          
          // Pulsing glow effect
          const glow = sin(danceTime.mul(2).add(radiusRatio.mul(PI2))).mul(0.3).add(0.7);
          
          // Particle alpha with soft edges
          const alpha = float(0.15).div(uv().sub(0.5).length()).sub(0.3).mul(glow);
          
          material.colorNode = vec4(colorFinal, alpha);
          
          // Create the flower
          const mesh = new THREE.InstancedMesh(
            new THREE.PlaneGeometry(1, 1),
            material,
            15000
          );
          
          this.el.setObject3D('mesh', mesh);
          
          // GUI controls
          const gui = new GUI();
          this.gui = gui;
          
          gui.add(size, 'value', 0.05, 0.3, 0.001).name('Petal Size');
          gui.add(danceSpeed, 'value', 0.1, 2, 0.1).name('Dance Speed');
          gui.add(swayAmount, 'value', 0, 1, 0.05).name('Sway Amount');
          
          gui
            .addColor({ color: centerColor.value.getHex(THREE.SRGBColorSpace) }, 'color')
            .name('Center Color')
            .onChange(function (value) {
              centerColor.value.set(value);
            });
          
          gui
            .addColor({ color: midColor.value.getHex(THREE.SRGBColorSpace) }, 'color')
            .name('Mid Color')
            .onChange(function (value) {
              midColor.value.set(value);
            });
          
          gui
            .addColor({ color: tipColor.value.getHex(THREE.SRGBColorSpace) }, 'color')
            .name('Tip Color')
            .onChange(function (value) {
              tipColor.value.set(value);
            });
        },
        
        remove() {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material.dispose();
            mesh.geometry.dispose();
            this.el.removeObject3D('mesh');
            this.gui.destroy();
          }
        }
      });
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"
    ></script>
  </head>
  <body>
    <a-scene background="color: #0a0a15">
      <a-entity dancing-flower></a-entity>
      <a-entity
        camera="fov: 50; near: 0.1; far: 100"
        look-controls="enabled: false"
        orbit-controls="target: 0 0.25 0; minDistance: 0.5; maxDistance: 10; initialPosition: 0 2 4; enableDamping: true; rotateSpeed: 0.8"
      ></a-entity>
    </a-scene>
  </body>
</html>
